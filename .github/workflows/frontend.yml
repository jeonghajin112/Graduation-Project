name: Frontend

on:
  push:
    branches: [main]
    paths:
      - "Accessibility-Dashboard/**"
      - ".github/workflows/frontend.yml"
      # The replay job exports the live report viewer fixture from the backend.
      - "ap-backend/src/main/**"
  pull_request:
    paths:
      - "Accessibility-Dashboard/**"
      - ".github/workflows/frontend.yml"
      # The replay job exports the live report viewer fixture from the backend.
      - "ap-backend/src/main/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, bundle, unit and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Accessibility-Dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Accessibility-Dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # Korean glyphs for the browser suites that measure text layout.
      - name: Install Korean fonts
        run: sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      # `npm test` runs pretest first: the bundle-boundary check (production
      # env files, with a placeholder live report viewer origin injected by
      # vite.config.ts for --mode analyze) and the Vitest unit suite, then the
      # `ci` browser suite. The replay/backend/scale suites need a real backend
      # or viewer and are run manually (see docs/testing.md).
      - name: Test
        run: npm test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-artifacts
          path: Accessibility-Dashboard/artifacts/frontend-tests/
          retention-days: 7
          if-no-files-found: ignore

  # Live report markers are rendered by the backend viewer runtime. These
  # checks export the viewer fixture from ap-backend with Gradle, so they run
  # in their own job instead of the isolated `ci` suite.
  live-report-replay:
    name: Live report replay (cross-stack)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: verify
    defaults:
      run:
        working-directory: Accessibility-Dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Accessibility-Dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Make the Gradle wrapper executable
        run: chmod +x ../ap-backend/gradlew

      - name: Replay suite
        run: npm run test:replay

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-report-replay-artifacts
          path: Accessibility-Dashboard/artifacts/frontend-tests/
          retention-days: 7
          if-no-files-found: ignore
